include=~/.local/state/ushell/theme/foot.ini

[main]
font=GeistMono Nerd Font:size=11, Symbols Nerd Font:size=14
pad=10x10

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-half-page=Mod1+Page_Up
scrollback-down-half-page=Mod1+Page_Down
